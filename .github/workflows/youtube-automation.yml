name: YouTube Automation Pipeline

# Keyless, free mode — no API keys, no Google login, no repository secrets.
#   Script + metadata : Ollama running a small open model on the runner
#   Narration         : Piper (offline text-to-speech)
#   Video + thumbnail : local slideshow renderer (Playwright + FFmpeg)
#   Upload            : manual — download the "generated-media" artifact and
#                       upload the MP4 to YouTube yourself.
#
# generate -> writes, voices and renders a video; MP4 + thumbnail saved as a run artifact
# status   -> prints the recent productions table
on:
  schedule:
    - cron: '31 0 * * *'     # generate: daily 00:31 UTC (06:01 IST)
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        type: choice
        options: [generate, status]
        default: generate
      topic:
        description: 'generate: topic (blank = agent picks)'
        required: false
      style:
        description: 'generate: style'
        type: choice
        options: ['', explainer, tutorial, list, review, story]
        default: ''
      length:
        description: 'generate: length'
        type: choice
        options: [short, medium, long]
        default: short

# One run at a time: they all share the same SQLite state.
concurrency:
  group: youtube-agent-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # needed to save/restore the state cache

env:
  NODE_ENV: production
  LOG_LEVEL: info
  CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
  DEFAULT_AUTHOR: ${{ vars.DEFAULT_AUTHOR }}
  TARGET_AUDIENCE: ${{ vars.TARGET_AUDIENCE }}
  YOUTUBE_REGION: ${{ vars.YOUTUBE_REGION || 'US' }}
  MAX_CONCURRENT_JOBS: '1'
  # Keyless mode
  YOUTUBE_UPLOAD: 'off'
  VIDEO_PROVIDER: slideshow
  OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'qwen2.5:3b' }}
  PIPER_VOICE_NAME: ${{ vars.PIPER_VOICE || 'en_US-lessac-medium' }}

jobs:
  run:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.54 can't install Chromium on
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Decide action
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "source=manual" >> "$GITHUB_OUTPUT"
          else
            echo "action=generate" >> "$GITHUB_OUTPUT"
            echo "source=scheduler" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (thumbnails / slideshow rendering)
        if: steps.plan.outputs.action == 'generate'
        run: npx playwright install --with-deps chromium

      # ---- Free local AI: Ollama (text) ----
      - name: Cache Ollama model
        if: steps.plan.outputs.action == 'generate'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama and pull model
        if: steps.plan.outputs.action == 'generate'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Run the server as the runner user so the model cache path is ours.
          sudo systemctl stop ollama 2>/dev/null || true
          export OLLAMA_MODELS="$HOME/.ollama/models"
          mkdir -p "$OLLAMA_MODELS"
          OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_KEEP_ALIVE=-1 nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          OLLAMA_MODELS="$OLLAMA_MODELS" ollama pull "$OLLAMA_MODEL"
          ollama list

      # ---- Free offline narration: Piper ----
      - name: Cache Piper voice
        if: steps.plan.outputs.action == 'generate'
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-${{ env.PIPER_VOICE_NAME }}

      - name: Install Piper TTS
        if: steps.plan.outputs.action == 'generate'
        run: |
          pip install --quiet piper-tts
          mkdir -p voices
          [ -f "voices/$PIPER_VOICE_NAME.onnx" ] || python3 -m piper.download_voices "$PIPER_VOICE_NAME" --data-dir voices
          echo "PIPER_VOICE=$GITHUB_WORKSPACE/voices/$PIPER_VOICE_NAME.onnx" >> "$GITHUB_ENV"
          echo "Piper voice check." | piper --model "voices/$PIPER_VOICE_NAME.onnx" --output_file /tmp/piper-check.wav
          ls -la /tmp/piper-check.wav

      # SQLite DB, rendered videos and thumbnails survive between runs via the cache.
      - name: Restore agent state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            uploads
          key: agent-state-${{ github.run_id }}
          restore-keys: agent-state-

      - name: Run agent (${{ steps.plan.outputs.action }})
        id: agent
        env:
          GENERATION_SOURCE: ${{ steps.plan.outputs.source }}
          TOPIC: ${{ inputs.topic }}
          STYLE: ${{ inputs.style }}
          LENGTH: ${{ inputs.length || 'short' }}
        run: node scripts/ci/run-once.js "${{ steps.plan.outputs.action }}"

      - name: Upload generated media (download this and upload to YouTube yourself)
        if: steps.plan.outputs.action == 'generate' && always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-media-${{ steps.agent.outputs.production_id || github.run_id }}
          path: |
            data/videos/${{ steps.agent.outputs.production_id }}*
            uploads/thumbnails/*
            data/captions/${{ steps.agent.outputs.production_id }}*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.plan.outputs.action }}-${{ github.run_id }}
          path: |
            logs/
            ollama.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save agent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            uploads
          key: agent-state-${{ github.run_id }}
